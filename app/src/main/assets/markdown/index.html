<!doctype html>
<html lang="zh-CN" class="__BODY_CLASS__">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:">
  <link rel="stylesheet" href="/assets/markdown/vendor/katex/katex.min.css">
  <style>
    :root {
      color-scheme: light;
      --background: __BACKGROUND_COLOR__;
      --surface: #f6f8fa;
      --surface-strong: #e9edf3;
      --text: #1f2328;
      --muted: #59636e;
      --border: #c7cdd5;
      --link: #005cc5;
      --accent: #0033b3;
      --quote: #7a1fa2;
      --code: #24292f;
      --keyword: #0033b3;
      --string: #067d17;
      --number: #1750eb;
      --function: #c41a16;
      --type: #7a1fa2;
      --comment: #59636e;
      --attribute: #a34a00;
    }

    html.dark,
    body.dark {
      color-scheme: dark;
      --background: __BACKGROUND_COLOR__;
      --surface: #2b2b2b;
      --surface-strong: #343434;
      --text: #d4d4d4;
      --muted: #9a9a9a;
      --border: #545454;
      --link: #9cdcfe;
      --accent: #9cdcfe;
      --quote: #c586c0;
      --code: #d4d4d4;
      --keyword: #cc8242;
      --string: #6a8759;
      --number: #7a9ec2;
      --function: #ffc66d;
      --type: #9cdcfe;
      --comment: #808080;
      --attribute: #d19a66;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--background);
      color: var(--text);
    }

    body {
      padding: 18px 16px 56px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: __FONT_SIZE__px;
      line-height: 1.62;
      overflow-wrap: break-word;
    }

    main {
      max-width: 980px;
      margin: 0 auto;
    }

    h1, h2, h3, h4, h5, h6 {
      margin: 1.35em 0 0.55em;
      line-height: 1.28;
      color: var(--text);
    }

    h1:first-child,
    h2:first-child {
      margin-top: 0;
    }

    h1, h2 {
      padding-bottom: 0.3em;
      border-bottom: 1px solid var(--border);
    }

    h1 { font-size: 1.85rem; }
    h2 { font-size: 1.45rem; }
    h3 { font-size: 1.2rem; }

    p, ul, ol, blockquote, pre, table, .diagram-shell {
      margin: 0.8em 0 1em;
    }

    ul, ol {
      padding-left: 1.6em;
    }

    li + li {
      margin-top: 0.3em;
    }

    a {
      color: var(--link);
      text-decoration-thickness: 1px;
      text-underline-offset: 0.16em;
    }

    blockquote {
      margin-left: 0;
      padding: 0.35em 1em;
      border-left: 4px solid var(--quote);
      color: var(--muted);
      background: var(--surface);
    }

    hr {
      height: 1px;
      margin: 1.5em 0;
      border: 0;
      background: var(--border);
    }

    code {
      padding: 0.14em 0.35em;
      border-radius: 4px;
      background: var(--surface-strong);
      color: var(--code);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 1em;
    }

    pre {
      position: relative;
      max-width: 100%;
      padding: 14px 16px;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      -webkit-overflow-scrolling: touch;
    }

    pre code {
      display: block;
      min-width: max-content;
      padding: 0;
      border-radius: 0;
      background: transparent;
      color: var(--code);
      font-size: 0.9em;
      line-height: 1.55;
      white-space: pre;
    }

    .copy-code {
      position: sticky;
      top: 6px;
      float: right;
      z-index: 1;
      min-width: 34px;
      min-height: 30px;
      margin: -6px -8px 4px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface-strong);
      color: var(--text);
      font: inherit;
    }

    table {
      display: block;
      width: max-content;
      max-width: 100%;
      overflow-x: auto;
      border-collapse: collapse;
      -webkit-overflow-scrolling: touch;
    }

    th, td {
      min-width: 92px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      text-align: left;
    }

    th {
      background: var(--surface-strong);
      font-weight: 700;
    }

    tr:nth-child(even) td {
      background: var(--surface);
    }

    img, svg {
      max-width: 100%;
      height: auto;
    }

    #content img {
      display: block;
      margin: 0.9em auto;
      border-radius: 6px;
      cursor: zoom-in;
    }

    .image-lightbox {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(0, 0, 0, 0.86);
    }

    .image-lightbox.open {
      display: flex;
    }

    .image-lightbox img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      cursor: zoom-out;
    }

    .task-list-item {
      list-style: none;
      margin-left: -1.35em;
    }

    .task-list-item input {
      width: 1.05em;
      height: 1.05em;
      margin-right: 0.5em;
      accent-color: var(--accent);
      vertical-align: -0.12em;
    }

    .footnotes {
      margin-top: 2em;
      padding-top: 0.75em;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.9em;
    }

    .front-matter {
      margin: 0 0 1.25em;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
    }

    .front-matter > summary {
      padding: 10px 12px;
      color: var(--muted);
      font-size: 0.9em;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
    }

    .front-matter[open] > summary {
      border-bottom: 1px solid var(--border);
    }

    .front-matter pre {
      margin: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
    }

    .diagram-shell {
      padding: 12px;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      -webkit-overflow-scrolling: touch;
    }

    .mermaid {
      width: 100%;
      text-align: center;
    }

    .math-block {
      max-width: 100%;
      padding: 8px 0;
      overflow-x: auto;
      overflow-y: hidden;
      text-align: center;
      -webkit-overflow-scrolling: touch;
    }

    .katex-display {
      max-width: 100%;
      padding: 8px 0;
      overflow-x: auto;
      overflow-y: hidden;
      color: var(--text);
    }

    .render-error {
      margin: 0.8em 0 1em;
      padding: 12px;
      border: 1px solid #b00020;
      border-radius: 6px;
      background: #fff0f2;
      color: #8b0018;
      white-space: pre-wrap;
    }

    .render-error-title {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .render-error-source {
      display: block;
      margin: 8px 0;
      padding: 8px 10px;
      overflow-x: auto;
      border: 1px solid currentColor;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.9em;
      white-space: pre-wrap;
    }

    .render-source-action {
      min-height: 36px;
      padding: 6px 10px;
      border: 1px solid currentColor;
      border-radius: 4px;
      background: transparent;
      color: inherit;
      font: inherit;
      font-weight: 700;
    }

    body.dark .render-error {
      background: #4a1820;
      color: #ffd9df;
    }

    .hljs-comment,
    .hljs-quote { color: var(--comment); font-style: italic; }
    .hljs-keyword,
    .hljs-selector-tag,
    .hljs-literal,
    .hljs-section,
    .hljs-link { color: var(--keyword); font-weight: 700; }
    .hljs-string,
    .hljs-regexp,
    .hljs-symbol,
    .hljs-bullet { color: var(--string); }
    .hljs-number,
    .hljs-meta,
    .hljs-built_in { color: var(--number); }
    .hljs-title,
    .hljs-title.function_,
    .hljs-function .hljs-title { color: var(--function); font-weight: 700; }
    .hljs-title.class_,
    .hljs-type,
    .hljs-class .hljs-title { color: var(--type); font-weight: 700; }
    .hljs-attr,
    .hljs-attribute,
    .hljs-selector-attr,
    .hljs-selector-class { color: var(--attribute); }
    .hljs-variable,
    .hljs-template-variable,
    .hljs-params { color: var(--quote); }
    .hljs-tag,
    .hljs-name { color: var(--keyword); }
  </style>
</head>
<body class="__BODY_CLASS__">
  <main id="content"></main>

  <script src="/assets/markdown/vendor/markdown-it.min.js"></script>
  <script src="/assets/markdown/vendor/markdown-it-task-lists.min.js"></script>
  <script src="/assets/markdown/vendor/markdown-it-footnote.min.js"></script>
  <script src="/assets/markdown/vendor/highlight.min.js"></script>
  <script src="/assets/markdown/vendor/katex/katex.min.js"></script>
  <script src="/assets/markdown/vendor/katex/contrib/auto-render.min.js"></script>
  <script src="/assets/markdown/vendor/mermaid.min.js"></script>
  <script>
    const darkTheme = __DARK_THEME__;
    const markdownBase64 = "__MARKDOWN_BASE64__";
    let markdownLineCount = 1;
    let pendingSourceLine = null;
    let lastReportedSourceLine = null;
    let sourcePositionFrame = null;

    function decodeBase64Utf8(value) {
      const binary = atob(value);
      const bytes = Uint8Array.from(binary, character => character.charCodeAt(0));
      return new TextDecoder("utf-8").decode(bytes);
    }

    function highlightedCode(code, language) {
      const normalized = (language || "").trim().toLowerCase();
      if (normalized && hljs.getLanguage(normalized)) {
        return hljs.highlight(code, { language: normalized, ignoreIllegals: true }).value;
      }
      return hljs.highlightAuto(code).value;
    }

    function extractFrontMatter(markdown) {
      // 仅识别文档起始且完整闭合的元数据区，普通正文分隔线仍交给 Markdown 渲染。 @author long
      const match = markdown.match(/^(?:\uFEFF)?---[ \t]*\r?\n([\s\S]*?)\r?\n(?:---|\.\.\.)[ \t]*(?:\r?\n|$)/);
      if (!match) return { source: markdown, yaml: null, lineOffset: 0 };
      return {
        source: markdown.slice(match[0].length),
        yaml: match[1],
        lineOffset: (match[0].match(/\n/g) || []).length
      };
    }

    function installFrontMatter(container, yaml, lineOffset) {
      if (yaml === null) return;

      const details = document.createElement("details");
      details.className = "front-matter";
      details.dataset.sourceStart = "1";
      details.dataset.sourceEnd = String(Math.max(1, lineOffset));

      const summary = document.createElement("summary");
      summary.textContent = "YAML Front Matter";
      details.appendChild(summary);

      const pre = document.createElement("pre");
      const code = document.createElement("code");
      code.className = "language-yaml hljs";
      // highlight.js 会先转义 YAML，避免元数据内容作为 HTML 注入预览。 @author long
      code.innerHTML = highlightedCode(yaml, "yaml");
      pre.appendChild(code);
      details.appendChild(pre);
      container.prepend(details);
    }

    function installHeadingAnchors(container) {
      container.querySelectorAll("h1, h2, h3, h4, h5, h6").forEach(function(heading, index) {
        heading.id = "heading-" + index;
      });
    }

    function installCodeCopyButtons(container) {
      container.querySelectorAll("pre").forEach(function(pre) {
        const code = pre.querySelector("code");
        if (!code) return;
        const button = document.createElement("button");
        button.type = "button";
        button.className = "copy-code";
        button.textContent = "复制";
        button.addEventListener("click", function() {
          if (window.CodeReader) window.CodeReader.copyText(code.textContent || "");
        });
        pre.insertBefore(button, code);
      });
    }

    function createRenderFallback(className, title, source) {
      const fallback = document.createElement("div");
      fallback.className = "render-error render-fallback " + className;
      fallback.setAttribute("role", "status");

      const heading = document.createElement("strong");
      heading.className = "render-error-title";
      heading.textContent = title;
      fallback.appendChild(heading);

      const rawSource = document.createElement("code");
      rawSource.className = "render-error-source";
      rawSource.textContent = source || "（没有可显示的原始内容）";
      fallback.appendChild(rawSource);

      const action = document.createElement("button");
      action.type = "button";
      action.className = "render-source-action";
      action.textContent = "查看源码";
      action.addEventListener("click", function() {
        if (window.CodeReader) window.CodeReader.showSource();
      });
      fallback.appendChild(action);
      return fallback;
    }

    function installImageLightbox(container) {
      const lightbox = document.createElement("div");
      lightbox.className = "image-lightbox";
      lightbox.setAttribute("role", "dialog");
      lightbox.setAttribute("aria-label", "图片预览");
      const preview = document.createElement("img");
      lightbox.appendChild(preview);
      lightbox.addEventListener("click", function() {
        lightbox.classList.remove("open");
        preview.removeAttribute("src");
      });
      document.body.appendChild(lightbox);

      container.querySelectorAll("img").forEach(function(image) {
        const showFailure = function() {
          if (!image.isConnected) return;
          const source = "![" + (image.alt || "图片") + "](" + (image.getAttribute("src") || "") + ")";
          image.replaceWith(createRenderFallback("image-fallback", "图片无法加载，已保留原始引用", source));
        };
        image.addEventListener("error", showFailure, { once: true });
        if (image.complete && image.naturalWidth === 0) {
          showFailure();
          return;
        }
        image.addEventListener("click", function() {
          preview.src = image.currentSrc || image.src;
          preview.alt = image.alt || "Markdown 图片";
          lightbox.classList.add("open");
        });
      });
    }

    function installMathFallbacks(container, failedFormulas) {
      container.querySelectorAll(".katex-error").forEach(function(error) {
        const source = error.textContent || error.getAttribute("title") || "";
        error.replaceWith(createRenderFallback("math-fallback", "数学公式无法渲染，已保留原始内容", source));
      });

      failedFormulas.forEach(function(formula) {
        const candidates = [
          "$$" + formula + "$$",
          "\\[" + formula + "\\]",
          "\\(" + formula + "\\)",
          "$" + formula + "$"
        ];
        const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
        let failedNode = null;
        while (walker.nextNode()) {
          if (candidates.includes(walker.currentNode.nodeValue || "")) {
            failedNode = walker.currentNode;
            break;
          }
        }
        if (failedNode) {
          failedNode.replaceWith(
            createRenderFallback("math-fallback", "数学公式无法渲染，已保留原始内容", failedNode.nodeValue)
          );
        }
      });
    }

    async function renderMermaidDiagrams(container) {
      const diagrams = Array.from(container.querySelectorAll(".mermaid"));
      for (const diagram of diagrams) {
        const source = diagram.textContent || "";
        try {
          await mermaid.run({ nodes: [diagram], suppressErrors: false });
        } catch (error) {
          const shell = diagram.closest(".diagram-shell") || diagram;
          shell.replaceWith(createRenderFallback("diagram-fallback", "Mermaid 流程图无法渲染，已保留源码", source));
        }
      }
    }

    function scrollToHeading(index) {
      const heading = document.getElementById("heading-" + index);
      if (heading) heading.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function sourceRangeAttributes(token, lineOffset) {
      if (!token.map) return "";
      const start = token.map[0] + lineOffset + 1;
      const end = Math.max(start, token.map[1] + lineOffset);
      return ' data-source-start="' + start + '" data-source-end="' + end + '"';
    }

    function installSourceRanges(tokens, lineOffset) {
      // markdown-it 的 block token 自带源码行区间，把它写入 DOM 后，两种阅读内核才能按语义块互相定位。 @author long
      tokens.forEach(function(token) {
        if (!token.map || (token.nesting !== 1 && token.type !== "hr")) return;
        token.attrSet("data-source-start", String(token.map[0] + lineOffset + 1));
        token.attrSet("data-source-end", String(Math.max(token.map[0] + lineOffset + 1, token.map[1] + lineOffset)));
      });
    }

    function sourceBlocks() {
      return Array.from(document.querySelectorAll("#content [data-source-start]"));
    }

    function sourceRange(element) {
      const start = Number(element.dataset.sourceStart || 1);
      const end = Number(element.dataset.sourceEnd || start);
      return { start: start, end: Math.max(start, end) };
    }

    function sourceBlockForLine(line) {
      const blocks = sourceBlocks();
      const containing = blocks.filter(function(element) {
        const range = sourceRange(element);
        return range.start <= line && range.end >= line;
      });
      if (containing.length) {
        return containing.reduce(function(best, element) {
          const bestRange = sourceRange(best);
          const range = sourceRange(element);
          return (range.end - range.start) <= (bestRange.end - bestRange.start) ? element : best;
        });
      }
      return blocks.reduce(function(best, element) {
        if (!best) return element;
        return Math.abs(sourceRange(element).start - line) < Math.abs(sourceRange(best).start - line) ? element : best;
      }, null);
    }

    function currentSourceLine() {
      const blocks = sourceBlocks();
      if (!blocks.length) {
        const scrollable = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
        return Math.max(1, Math.round((window.scrollY / scrollable) * Math.max(0, markdownLineCount - 1)) + 1);
      }
      const anchor = Math.min(120, Math.max(48, window.innerHeight * 0.18));
      let best = null;
      let bestDistance = Number.POSITIVE_INFINITY;
      blocks.forEach(function(element) {
        const rect = element.getBoundingClientRect();
        const distance = rect.top <= anchor && rect.bottom >= anchor
          ? 0
          : Math.min(Math.abs(rect.top - anchor), Math.abs(rect.bottom - anchor));
        if (distance < bestDistance) {
          best = element;
          bestDistance = distance;
        } else if (distance === bestDistance && best) {
          const range = sourceRange(element);
          const bestRange = sourceRange(best);
          if ((range.end - range.start) < (bestRange.end - bestRange.start)) best = element;
        }
      });
      return best ? sourceRange(best).start : 1;
    }

    function reportCurrentSourceLine() {
      const line = currentSourceLine();
      if (line === lastReportedSourceLine) return;
      lastReportedSourceLine = line;
      if (window.CodeReader && window.CodeReader.reportReadingPosition) {
        window.CodeReader.reportReadingPosition(line);
      }
    }

    function scheduleSourcePositionReport() {
      if (sourcePositionFrame !== null) return;
      sourcePositionFrame = window.requestAnimationFrame(function() {
        sourcePositionFrame = null;
        reportCurrentSourceLine();
      });
    }

    function scrollToSourceLine(line) {
      const normalizedLine = Math.max(1, Math.min(markdownLineCount, Number(line) || 1));
      pendingSourceLine = normalizedLine;
      document.documentElement.dataset.sourceTargetLine = String(normalizedLine);
      const target = sourceBlockForLine(normalizedLine);
      if (target) {
        target.scrollIntoView({ behavior: "auto", block: "start" });
      } else {
        const ratio = (normalizedLine - 1) / Math.max(1, markdownLineCount - 1);
        const scrollable = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
        window.scrollTo(0, scrollable * ratio);
      }
      if (document.documentElement.dataset.markdownReady === "true") pendingSourceLine = null;
      scheduleSourcePositionReport();
    }

    function installSourcePositionReporting() {
      // 滚动一帧只回传一次语义行，并由原生层再次按行去重，避免拖动时频繁刷新 Compose。 @author long
      window.addEventListener("scroll", scheduleSourcePositionReport, { passive: true });
    }

    function extractMathBlocks(markdown) {
      const blocks = [];
      const source = markdown.replace(/^[ \t]*\$\$[ \t]*\r?\n([\s\S]*?)\r?\n^[ \t]*\$\$[ \t]*$/gm, function(matched, formula) {
        const marker = "CODE_READER_MATH_BLOCK_" + blocks.length + "_END";
        blocks.push({ marker: marker, formula: formula });
        // 占位文本保持原公式块的换行数量，后续 token.map 才仍对应原始 Markdown 行号。 @author long
        return marker + "\n".repeat((matched.match(/\n/g) || []).length);
      });
      return { source: source, blocks: blocks };
    }

    function renderExtractedMathBlocks(container, blocks) {
      if (!blocks.length) return;

      blocks.forEach(function(block) {
        const parent = Array.from(container.querySelectorAll("p")).find(function(element) {
          return element.textContent.trim() === block.marker;
        });
        if (!parent) throw new Error("找不到块级公式占位符：" + block.marker);

        let host = document.createElement("div");
        host.className = "math-block";
        try {
          katex.render(block.formula, host, {
            displayMode: true,
            throwOnError: true
          });
        } catch (error) {
          host = createRenderFallback(
            "math-fallback",
            "数学公式无法渲染，已保留原始内容",
            "$$\n" + block.formula + "\n$$"
          );
        }

        host.dataset.sourceStart = parent.dataset.sourceStart || "";
        host.dataset.sourceEnd = parent.dataset.sourceEnd || host.dataset.sourceStart;
        parent.replaceWith(host);
      });
    }

    async function renderMarkdown() {
      const content = document.getElementById("content");
      try {
        const markdown = decodeBase64Utf8(markdownBase64);
        markdownLineCount = markdown.split(/\r?\n/).length;
        const frontMatter = extractFrontMatter(markdown);
        const extractedMath = extractMathBlocks(frontMatter.source);
        const markdownRenderer = window.markdownit({
          html: false,
          linkify: true,
          typographer: true,
          highlight: highlightedCode
        });
        markdownRenderer.use(window.markdownitTaskLists, { enabled: true, label: true });
        markdownRenderer.use(window.markdownitFootnote);

        const defaultFence = markdownRenderer.renderer.rules.fence;
        markdownRenderer.renderer.rules.fence = function(tokens, index, options, environment, renderer) {
          const token = tokens[index];
          const language = token.info.trim().split(/\s+/)[0].toLowerCase();
          const sourceAttributes = sourceRangeAttributes(token, frontMatter.lineOffset);
          if (language === "mermaid") {
            return '<div class="diagram-shell"' + sourceAttributes + '><div class="mermaid">' +
              markdownRenderer.utils.escapeHtml(token.content) +
              '</div></div>';
          }
          return defaultFence(tokens, index, options, environment, renderer).replace("<pre", "<pre" + sourceAttributes);
        };

        const tokens = markdownRenderer.parse(extractedMath.source, {});
        installSourceRanges(tokens, frontMatter.lineOffset);
        content.innerHTML = markdownRenderer.renderer.render(tokens, markdownRenderer.options, {});
        installFrontMatter(content, frontMatter.yaml, frontMatter.lineOffset);
        installHeadingAnchors(content);
        installCodeCopyButtons(content);
        installImageLightbox(content);
        renderExtractedMathBlocks(content, extractedMath.blocks);

        const failedFormulas = [];
        let activeFormula = "";
        renderMathInElement(content, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "\\[", right: "\\]", display: true },
            { left: "\\(", right: "\\)", display: false },
            { left: "$", right: "$", display: false }
          ],
          ignoredTags: ["script", "noscript", "style", "textarea", "pre", "code"],
          throwOnError: true,
          // auto-render 的错误回调不提供 DOM 节点；preProcess 同步记录当前公式，便于就地恢复原始文本。 @author long
          preProcess: function(formula) {
            activeFormula = formula;
            return formula;
          },
          errorCallback: function() {
            failedFormulas.push(activeFormula);
          }
        });
        installMathFallbacks(content, failedFormulas);

        mermaid.initialize({
          startOnLoad: false,
          securityLevel: "strict",
          theme: darkTheme ? "dark" : "default",
          flowchart: { htmlLabels: false, useMaxWidth: true }
        });
        await renderMermaidDiagrams(content);
        document.documentElement.dataset.markdownReady = "true";
        installSourcePositionReporting();
        if (pendingSourceLine !== null) scrollToSourceLine(pendingSourceLine);
        else reportCurrentSourceLine();
      } catch (error) {
        content.insertAdjacentHTML(
          "beforeend",
          '<div class="render-error">Markdown 渲染失败：' +
            String(error && error.message ? error.message : error) +
            '</div>'
        );
        document.documentElement.dataset.markdownReady = "error";
      }
    }

    renderMarkdown();
  </script>
</body>
</html>
